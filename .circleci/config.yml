# This config was automatically generated from your source code
# Stacks detected: cicd:github-actions:.github/workflows,cicd:gitlab-workflows:.,deps:node:.
version: 2.1
orbs:
  node: circleci/node@5
jobs:
  test-node:
    # Install node dependencies and run tests
    executor: node/default
    steps:
      - checkout
      - node/install-packages:
          cache-path: ~/project/node_modules
          override-ci-command: npm install
      - run:
          name: Run tests
          command: npm test --passWithNoTests
  build-node:
    # Build node project
    executor: node/default
    steps:
      - checkout
      - node/install-packages:
          cache-path: ~/project/node_modules
          override-ci-command: npm install
      - run:
          command: npm run build
      - run:
          name: Create the ~/artifacts directory if it doesn't exist
          command: mkdir -p ~/artifacts
      # Copy output to artifacts dir
      - run:
          name: Copy artifacts
          command: cp -R build dist public .output .next .docusaurus ~/artifacts 2>/dev/null || true
      - store_artifacts:
          path: ~/artifacts
          destination: node-build
  deploy:
    docker:
      - image: cimg/base:stable
    steps:
      # ==========================================================
      # ERRO 2 - LUGAR CERTO DO "steps"
      # O "steps" pertence AQUI, dentro da definicao do job.
      # No arquivo com erro ele estava la embaixo, dentro de
      # "workflows > jobs > deploy", o que gera:
      #   Error calling job: 'deploy'
      #   Unexpected argument(s): steps
      # ==========================================================

      # ==========================================================
      # ERRO 1 - A CAUSA DO PROBLEMA DO ALUNO
      # No config dele estava assim:
      #
      #   - setup_remote_docker:
      #       version: 24.0.7
      #
      # O CircleCI nao aceita mais numero de versao fixo do Docker
      # nesse step. As tags validas hoje sao: default, edge,
      # previous, docker29, docker27, docker26 (e a antiga 20.10.24).
      # Com "24.0.7" o job e rejeitado em 0s, antes de rodar
      # qualquer step, com a mensagem:
      #   "Job was rejected because the requested resource class is
      #    not available for Remote Docker, or the Docker version is
      #    not supported on this resource class."
      #
      # CORRECAO: usar o step sem a chave "version" (abaixo),
      # ou entao "- setup_remote_docker:" + "    version: default".
      # ==========================================================
      - setup_remote_docker

      - run:
          name: Confirma que o remote Docker subiu
          command: docker version
workflows:
  build-and-test:
    jobs:
      - test-node
      - build-node:
          requires:
            - test-node
      - deploy:
          requires:
            - build-node
